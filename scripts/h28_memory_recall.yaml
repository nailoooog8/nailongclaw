# H28 E2E（召回）：一步 memory_recall，query 来自触发语料。
#
# 为什么需要这个文件：H28 要验的是「memory_recall 的结果在 Claude UI 聊天页渲染
# 成记忆 chips，且历史恢复后仍是 chips」。触发必须确定，否则用例时红时绿——
# release 构建里 DebugTaskReceiver / LAN debug 端点都被 BuildConfig.DEBUG 关着
# （关得对）。用户技能的 Tier 1.5 触发匹配是确定性正则、0 次 LLM 调用，
# SkillExecutor 直接调 ToolRegistry.executeTool —— 与 agent loop 同一条生产路径。
# 触发语料：`h28 recall <query>`（ASCII，因 adb input text 打不了 CJK）。
#
# 放 <外部文件目录>/skills/ 下，重启 app 自动加载注册（UserSkillLoader 只在
# ClawApplication.onCreate 里加载，所以必须重启进程）。
id: h28_memory_recall
name: H28 记忆召回
description: H28 测试技能，按关键词检索记忆库，例如 h28 recall H28
category: TEST
user_facing: false
estimated_steps_saved: 1
triggers:
  - "h28 recall {msg}"
parameters: []
steps:
  - tool: memory_recall
    description: 检索记忆库
    optional: false
    retries: 1
    params:
      query: "{msg}"
fallback_goal: 检索记忆库
