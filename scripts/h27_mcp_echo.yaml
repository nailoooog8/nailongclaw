# H27 E2E：把一次调用定向到 qatools MCP 服务器的 echo 工具。
#
# 为什么需要这个文件：H27 要验的是「MCP 工具执行前必须有人点头」。触发必须
# 确定，否则用例时红时绿——而 release 构建里两条本来很顺手的确定触发都被
# BuildConfig.DEBUG 关着（DebugTaskReceiver 第一行就 return，LAN 控制台的
# /api/debug/execute 也明确禁止）。这两处关得对，不该为测试打开。
#
# 用户技能的 Tier 1.5 触发匹配是确定性正则、0 次 LLM 调用，SkillExecutor 直接
# 调 ToolRegistry.executeTool —— 与 agent loop 走同一条生产路径，只是"要不要调
# 这个工具"不再由模型随机决定。触发语料：`h27 echo <任意文字>`。
#
# 放 <外部文件目录>/skills/ 下，重启 app 自动加载注册（UserSkillLoader 只在
# ClawApplication.onCreate 里加载，所以必须重启进程）。
id: h27_mcp_echo
name: H27 MCP 回显
description: H27 测试技能，调用 qatools MCP 服务器的 echo 工具回显一段文字，例如 h27 echo 你好
category: TEST
user_facing: false
estimated_steps_saved: 1
triggers:
  - "h27 echo {msg}"
parameters: []
steps:
  - tool: mcp_qatools_echo
    description: 调用 MCP echo 工具
    optional: false
    retries: 1
    params:
      message: "{msg}"
fallback_goal: 调用 MCP echo 工具
